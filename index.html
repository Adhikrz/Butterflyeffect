<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BUTTERFLYEFFECT — Experimental Photo Lab</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">

    <div class="brand">
      <div class="brand-symbol">✦</div>

      <div>
        <div class="brand-name">BUTTERFLYEFFECT</div>
        <div class="brand-sub">EXPERIMENTAL PHOTO LAB</div>
      </div>
    </div>

    <div class="top-actions">
      <button id="randomBtn">⤨ RANDOM</button>
      <button id="beforeBtn">BEFORE</button>
      <button id="downloadBtn" class="primary">DOWNLOAD</button>
    </div>

  </header>


  <!-- MAIN -->
  <main>

    <section class="workspace">

      <!-- FILTER LIBRARY -->
      <aside class="library">

        <div class="library-head">

          <div class="library-title">
            <span id="count">110</span>
            SKINS
            <span class="loaded">LOADED</span>
          </div>

          <input
            id="search"
            type="text"
            placeholder="Search effects..."
          >

        </div>

        <div id="filterList" class="filter-list"></div>

      </aside>


      <!-- IMAGE WORKSPACE -->
      <section class="stage-wrap">

        <div id="dropzone" class="stage">

          <canvas id="canvas"></canvas>

          <!-- EMPTY SCREEN -->
          <div id="empty" class="empty">

            <div class="orb">✦</div>

            <h1>DROP A PHOTO</h1>

            <p>
              or choose an image to begin the experiment
            </p>

            <label class="upload primary">
              CHOOSE IMAGE
              <input
                id="fileInput"
                type="file"
                accept="image/*"
              >
            </label>

          </div>

          <div class="stage-label">
            <span id="skinNo">01</span>
            /
            <span id="skinName">X-RAY SCAN</span>
          </div>

        </div>


        <!-- CONTROLS -->
        <div class="controls">

          <div class="selected">

            <small>SELECTED SKIN</small>

            <strong id="selectedName">
              X-Ray Scan
            </strong>

            <span id="selectedDesc">
              Radiographic luminance reconstruction
            </span>

          </div>


          <div class="sliderbox">

            <label>
              INTENSITY
              <output id="intensityOut">100%</output>
            </label>

            <input
              id="intensity"
              type="range"
              min="0"
              max="100"
              value="100"
            >

          </div>


          <div class="ratio">

            <label>RATIO</label>

            <select id="ratio">

              <option value="3:4">3:4</option>
              <option value="1:1">1:1</option>
              <option value="4:3">4:3</option>
              <option value="16:9">16:9</option>
              <option value="9:16">9:16</option>

            </select>

          </div>

        </div>

      </section>

    </section>


    <!-- BOTTOM BAR -->
    <section class="bottom">

      <div class="uploadline">

        <label class="upload">
          ＋ ADD PHOTO
          <input
            id="fileInput2"
            type="file"
            accept="image/*"
          >
        </label>

        <button id="resetBtn">
          RESET
        </button>

        <button id="creatorBtn">
          ＋ FILTER CREATOR
        </button>

      </div>

      <div id="status">
        READY · ORIGINAL IMAGE
      </div>

    </section>

  </main>


  <!-- FILTER CREATOR -->
  <div id="creator" class="modal hidden">

    <div class="modal-card">

      <button
        class="close"
        id="closeCreator"
      >
        ×
      </button>

      <div class="eyebrow">
        BUILD YOUR OWN
      </div>

      <h2>
        FILTER CREATOR
      </h2>

      <input
        id="customName"
        placeholder="Filter name"
      >

      <select id="customBase"></select>

      <label>

        INTENSITY

        <output id="customOut">
          80%
        </output>

      </label>

      <input
        id="customIntensity"
        type="range"
        min="0"
        max="100"
        value="80"
      >

      <button
        id="saveCustom"
        class="primary wide"
      >
        SAVE TO LIBRARY
      </button>

    </div>

  </div>


  <!-- SCRIPTS -->
  <script src="filters.js"></script>
  <script src="app.js"></script>

</body>
</html>
